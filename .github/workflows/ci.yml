          -f supabase/migrations/20261024205621_atlas_engine_outbox_fencing_v1.sql
          -f tests/sql/engine-outbox-fencing-checks.sql
          -f supabase/migrations/20261025114614_atlas_engine_agent_request_v1.sql
          -f tests/sql/engine-agent-request-checks.sql
          -f tests/sql/engine-team-request-checks.sql
          -f supabase/proposals/engine-mission-agent-assignment-v1.sql
          -f tests/sql/engine-mission-agent-assignment-checks.sql

      - name: Verify concurrent agent-profile request idempotence
        env:
          ATLAS_ENGINE_DISPOSABLE_TEST: "1"
        run: |
          bash tests/sql/engine-agent-request-concurrency.sh
          bash tests/sql/engine-team-request-concurrency.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify approval decisions under contending PostgreSQL connections
        env:
          ATLAS_ENGINE_DISPOSABLE_TEST: "1"
        run: node tests/approval-decision-concurrency.mjs
      - name: Verify mission-agent context snapshots and concurrent revocation
        env:
          ATLAS_ENGINE_DISPOSABLE_TEST: "1"
        run: node tests/engine-context-postgres.mjs
      - name: Verify simulated workers with concurrent processes and crash recovery
