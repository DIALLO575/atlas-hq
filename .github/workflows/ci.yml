name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-oauth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply OAuth migrations and verify server-only grants in disposable PostgreSQL
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f tests/sql/linear-oauth-state-fixture.sql
          -f supabase/migrations/20261024093000_atlas_linear_oauth_states.sql
          -f tests/sql/linear-oauth-state-migration.sql
          -f supabase/migrations/20261024103000_atlas_linear_oauth_connections.sql
          -f supabase/migrations/20261024104500_linear_oauth_refresh_gate.sql
          -f tests/sql/linear-oauth-connection-migration.sql
      - name: Verify expiry and atomic concurrent consumption
        run: bash tests/sql/linear-oauth-state-concurrency.sh
      - name: Verify serialized refresh, connection rotation, and revocation
        run: bash tests/sql/linear-oauth-connection-concurrency.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^..$HEAD_SHA"
          fi
      - name: Audit dependencies
        # GHSA-vfj7-8cjw-p6xm currently has no patched braces release. Allow only
        # that advisory on its known eslint-config-next dev-dependency path.
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (report.error) {
            console.error("npm audit failed:", report.error);
            process.exit(1);
          }

          const advisory = "GHSA-vfj7-8cjw-p6xm";
          const allowedPackages = new Set([
            "braces",
            "micromatch",
            "fast-glob",
            "@next/eslint-plugin-next",
            "eslint-config-next",
          ]);
          const vulnerabilities = report.vulnerabilities ?? {};
          function isOnlyAcceptedAdvisory(name, seen = new Set()) {
            if (!allowedPackages.has(name) || seen.has(name) || !vulnerabilities[name]) return false;
            const path = new Set(seen).add(name);
            const via = vulnerabilities[name].via ?? [];
            if (via.some((entry) => typeof entry === "object" &&
                (entry.url ?? "").toLowerCase().endsWith(advisory.toLowerCase()))) return true;
            return via.some((entry) => typeof entry === "string" &&
              isOnlyAcceptedAdvisory(entry, path));
          }

          const high = Object.entries(vulnerabilities)
            .filter(([, item]) => ["high", "critical"].includes(item.severity));
          const unexpected = high.filter(([name]) => !isOnlyAcceptedAdvisory(name));
          if (unexpected.length) {
            console.error("Unaccepted high or critical npm advisories:", unexpected.map(([name]) => name));
            process.exit(1);
          }
          if (high.length) {
            console.log(`Accepted ${high.length} high-severity finding(s) only for ${advisory} on the documented braces dependency path; recheck when upstream publishes a fix.`);
          } else {
            console.log("No high or critical npm audit findings.");
          }
          NODE
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
