<!doctype html><meta charset="utf-8"><title>Journal cache browser verification</title><pre id="result">RUNNING</pre><section id="items"></section><script type="module">
import {journalCacheStorage} from '/public/journal-cache-storage.mjs';
const report={browser:navigator.userAgent,checks:[],measurements:[]};const assert=(condition,name)=>{if(!condition)throw Error(name);report.checks.push(name);};let peer,store;
try {
 store=await journalCacheStorage();await store.cache.purge();const token=await store.cache.open(JSON.stringify(['browser-fixture-user','11111111-1111-4111-8111-111111111111']));
 const payload={editionId:'fixture',items:Array.from({length:80},(_,i)=>({id:'i'+i,key:JSON.stringify(['fixture','i'+i]),title:'Fixture '+i,summary:'Fixture content '.repeat(300),state:'new'}))};
 await store.cache.save(token,payload,undefined,Date.now());store.close();store=await journalCacheStorage();assert((await store.cache.snapshot(token)).editions[0].payload.items.length===80,'IndexedDB survives connection reopen');
 for(let n=0;n<20;n++){const start=performance.now();const root=await store.cache.snapshot(token);document.getElementById('items').replaceChildren(...root.editions[0].payload.items.map(item=>{const p=document.createElement('p');p.textContent=item.title+' '+item.summary;return p;}));await new Promise(requestAnimationFrame);report.measurements.push(performance.now()-start);}
 const sorted=[...report.measurements].sort((a,b)=>a-b);report.p95Ms=sorted[Math.ceil(sorted.length*.95)-1];assert(report.p95Ms<300,'80-item scoped cached render p95 below 300ms on CI browser');
 const ready=new Promise(resolve=>{addEventListener('message',function listener(e){if(e.origin===location.origin&&e.data.ready){removeEventListener('message',listener);resolve();}});});peer=open('/tests/browser/journal-cache-peer.html','journal-cache-peer');assert(Boolean(peer),'second tab opened');await ready;
 const call=operation=>new Promise((resolve,reject)=>{const id=crypto.randomUUID(),timer=setTimeout(()=>reject(Error('Peer timeout')),5000);addEventListener('message',function listener(e){if(e.origin===location.origin&&e.data.id===id){clearTimeout(timer);removeEventListener('message',listener);if(e.data.error)reject(Error(e.data.error));else resolve(e.data.result);}});peer.postMessage({id,operation,token},location.origin);});
 assert((await call('snapshot')).scope===token.scope,'second tab sees same scoped database');const notified=new Promise(resolve=>addEventListener('storage',function listener(event){if(event.key==='atlas.journal.purge'){removeEventListener('storage',listener);resolve(true);}}));await call('purge');assert(await notified,'logout purge notifies another real tab');assert(await store.cache.snapshot(token)===null,'purge from second tab invalidates first tab');assert(await store.cache.save(token,payload,undefined,Date.now())===false,'stale first-tab write cannot resurrect purged data');assert(await call('save')===false,'stale peer-tab write cannot resurrect purged data');
 const switched=await store.cache.open(JSON.stringify(['different-user','different-workspace']));assert((await store.cache.snapshot(switched)).editions.length===0,'new account receives no old edition');report.ok=true;
}catch(error){report.ok=false;report.error=error.message;}finally{peer?.close();store?.close();document.getElementById('result').textContent=JSON.stringify(report);document.body.dataset.result=report.ok?'PASS':'FAIL';}
</script>
